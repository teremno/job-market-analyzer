[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-analyzer"
version = "0.1.0"
description = "Collect and analyze remote job market data."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "pydantic>=2.10",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9",
    "pytest>=8.3",
    "ruff>=0.15,<0.16",
]

[project.scripts]
job-market-analyzer = "job_market_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.setuptools.package-data]
job_market_analyzer = ["storage/*.sql"]
